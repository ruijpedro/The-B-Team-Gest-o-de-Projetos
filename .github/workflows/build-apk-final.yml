name: Build APK Final

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare web folder
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -r src dist/src || true
          cp -r assets dist/assets || true
          cp -r templates dist/templates || true

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rjp.bteam",
            "appName": "The B Team",
            "webDir": "dist"
          }
          EOF

      - name: Recreate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch Android project
        run: |
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.9-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-8.11.1-all.zip/gradle-8.9-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rjp.bteam'
              compileSdk 35

              defaultConfig {
                  applicationId "com.rjp.bteam"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation project(':capacitor-android')
              implementation project(':capacitor-cordova-android-plugins')
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          echo "===== android/app/build.gradle FINAL ====="
          cat android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The_B_Team_debug_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
