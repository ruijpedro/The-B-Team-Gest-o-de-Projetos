name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6
          npm install @capacitor/cli@6
          npm install @capacitor/android@6

      - name: Create capacitor config
        run: |
          echo '{
            "appId":"com.rjp.thebteam",
            "appName":"The B Team",
            "webDir":"dist"
          }' > capacitor.config.json

      - name: Add Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Force Kotlin version
        run: |
          echo "" >> android/gradle.properties
          echo "kotlin.code.style=official" >> android/gradle.properties

          cat > android/build.gradle <<'EOF'
          buildscript {
              ext.kotlin_version = '1.9.24'

              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }

              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.24'
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The_B_Team_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
